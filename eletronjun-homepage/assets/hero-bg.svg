<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1712"/>
      <stop offset="55%" stop-color="#101f16"/>
      <stop offset="100%" stop-color="#0a140f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2f5a1c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f5a1c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pcb" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M0 30 H50 V90 H160" fill="none" stroke="#46cf07" stroke-opacity="0.16" stroke-width="1.5"/>
      <path d="M20 160 V120 H95 V55 H160" fill="none" stroke="#46cf07" stroke-opacity="0.11" stroke-width="1.5"/>
      <path d="M120 0 V40 H160" fill="none" stroke="#8bc34a" stroke-opacity="0.13" stroke-width="1.5"/>
      <path d="M0 110 H35" fill="none" stroke="#8bc34a" stroke-opacity="0.13" stroke-width="1.5"/>
      <circle cx="50" cy="30" r="3.2" fill="#46cf07" fill-opacity="0.22"/>
      <circle cx="50" cy="90" r="3.2" fill="#46cf07" fill-opacity="0.2"/>
      <circle cx="95" cy="55" r="3" fill="#8bc34a" fill-opacity="0.18"/>
      <circle cx="120" cy="40" r="3" fill="#8bc34a" fill-opacity="0.16"/>
      <circle cx="20" cy="120" r="2.6" fill="#46cf07" fill-opacity="0.16"/>
      <circle cx="140" cy="130" r="2.2" fill="#8bc34a" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#pcb)"/>

  <!-- faint oversized chip silhouette, purely decorative -->
  <g transform="translate(1060,150) rotate(8)" opacity="0.07">
    <rect x="0" y="0" width="420" height="300" rx="28" fill="#eafbdd"/>
    <g stroke="#eafbdd" stroke-width="10">
      <line x1="40" y1="-40" x2="40" y2="0"/>
      <line x1="110" y1="-40" x2="110" y2="0"/>
      <line x1="180" y1="-40" x2="180" y2="0"/>
      <line x1="250" y1="-40" x2="250" y2="0"/>
      <line x1="320" y1="-40" x2="320" y2="0"/>
      <line x1="380" y1="-40" x2="380" y2="0"/>
      <line x1="40" y1="300" x2="40" y2="340"/>
      <line x1="110" y1="300" x2="110" y2="340"/>
      <line x1="180" y1="300" x2="180" y2="340"/>
      <line x1="250" y1="300" x2="250" y2="340"/>
      <line x1="320" y1="300" x2="320" y2="340"/>
      <line x1="380" y1="300" x2="380" y2="340"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
